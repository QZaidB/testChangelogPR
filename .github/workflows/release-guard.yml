name: Release guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  changelog-built:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the changelog has been built
        run: |
          left=$(find changelog -type f ! -name README.md 2>/dev/null | tr '\n' ' ')
          if [ -n "$left" ]; then
            echo "::error::Unreleased changelog entries: $left- Run Actions → Release for this branch, merge its PR into this branch, then merge here."
            exit 1
          fi
          echo "Changelog is built. Ready to release."