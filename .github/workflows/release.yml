name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.0.1.1.0"
        required: true

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check version format
        run: |
          echo "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)*$' || {
            echo "::error::Version must look like 1.0.1.1.0 (numbers and dots)"
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: release-candidate
      - uses: astral-sh/setup-uv@v6
      - name: Build changelog on a release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/$VERSION"
          uvx towncrier build --yes --version "$VERSION"
          git commit -m "Release $VERSION"
          git push origin "release/$VERSION"
      - name: Link to open the PR
        run: |
          echo "### Next: [open the release PR](https://github.com/${{ github.repository }}/compare/release-candidate...release/$VERSION?expand=1)" >> "$GITHUB_STEP_SUMMARY"
