name: Changelog preview

on:
  push:
    branches: ['release/**']
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: astral-sh/setup-uv@v6
      - name: Post preview on the release candidate PR
        run: |
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open PR from $BRANCH into main. Nothing to update."
            exit 0
          fi

          {
            echo "### Changelog preview"
            echo
            if [ -z "$(find changelog -type f ! -name README.md)" ]; then
              echo "No unreleased entries. Everything is in \`changelog.toml\`."
            else
              echo '```toml'
              uvx towncrier build --config deployment/towncrier.toml --dir . --draft --version unreleased 2>/dev/null
              echo '```'
              echo
              echo "_Updated after every merge. Run **Actions → Release** to write it to \`changelog.toml\`._"
            fi
          } > preview.md

          gh pr comment "$pr" --edit-last --create-if-none --body-file preview.md