name: "Release candidate: assemble changelog"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number a.b.c, e.g. 1.2.0"
        required: true

permissions:
  contents: write

jobs:
  assemble:
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      RC: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Assemble changelog on a new branch
        run: |
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Version must be a.b.c, e.g. 1.2.0"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git switch -c "changelog/$VERSION"
          uvx towncrier build --config deployment/towncrier.toml --dir . --yes --version "$VERSION"
          git commit -m "Assemble changelog $VERSION"
          git push origin "changelog/$VERSION"
          echo "### Next: [open the changelog PR](https://github.com/${{ github.repository }}/compare/$RC...changelog/$VERSION?expand=1)" >> "$GITHUB_STEP_SUMMARY"