name: "Feature PR: changelog entry required"

on:
  pull_request:
    branches: ['release/**']
    types: [opened, synchronize, reopened]

jobs:
  changelog:
    if: ${{ !startsWith(github.head_ref, 'changelog/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Check for a changelog file
        run: |
          uvx towncrier check --config deployment/towncrier.toml --dir . --compare-with origin/${{ github.base_ref }} || {
            echo "::error::No changelog file found. Double-click new-change.bat, commit the file and push."
            exit 1
          }