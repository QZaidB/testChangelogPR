name: PR checks

on:
  pull_request:
    branches: [release-candidate]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

jobs:
  title:
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^[A-Z]+-[0-9]+: .{10,}'; then
            echo "::error::PR title must look like 'PLC-123: Short description'. Click Edit next to the title at the top of the PR page."
            exit 1
          fi

  changelog:
    if: ${{ !startsWith(github.head_ref, 'release/') && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Check for a changelog file
        run: |
          uvx towncrier check --compare-with origin/${{ github.base_ref }} || {
            echo "::error::No changelog file found. Double-click new-change.bat, commit the file and push. No entry needed? Ask a reviewer to add the no-changelog label."
            exit 1
          }
      - name: Preview the changelog
        run: uvx towncrier build --draft --version preview
