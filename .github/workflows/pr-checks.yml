name: PR checks

on:
  pull_request:
    branches: ['release/**']
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    if: ${{ !startsWith(github.head_ref, 'changelog/') && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Check for a changelog file
        run: |
          uvx towncrier check --config deployment/towncrier.toml --dir . --compare-with origin/${{ github.base_ref }} || {
            echo "::error::No changelog file found. Double-click new-change.bat, commit the file and push. No entry needed? Ask a reviewer to add the no-changelog label."
            exit 1
          }
      - name: Preview the changelog
        run: uvx towncrier build --config deployment/towncrier.toml --dir . --draft --version preview
