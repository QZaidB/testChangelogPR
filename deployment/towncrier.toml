[tool.towncrier]
directory = "changelog"
filename = "changelog.toml"
template = "deployment/changelog-template.toml.j2"
start_string = "# 10Qx QCR release notes start"
title_format = false
issue_format = "{issue}"

# Change types
[tool.towncrier.fragment.added]
[tool.towncrier.fragment.changed]
[tool.towncrier.fragment.deprecated]
[tool.towncrier.fragment.removed]
[tool.towncrier.fragment.fixed]
[tool.towncrier.fragment.security]
[tool.towncrier.fragment.hmi]